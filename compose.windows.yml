# Windows development override
#
# Runs infrastructure services + the Fastify backend inside Docker, while
# the Vite client runs natively on Windows for fast, OS-level HMR.
#
# Must be layered on top of compose.override.yml (which provides the build
# context, environment variables, and volumes for the server service):
#
#   docker compose -f compose.yml -f compose.override.yml -f compose.windows.yml up
#
# Then in a separate terminal (native Windows/WSL2 shell):
#   npm run dev:client

services:
  server:
    # Only start the Fastify API server – Vite runs on the host instead.
    command: bash -l -c "npm install && npm run dev -w server -- --port 3000"
